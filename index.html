```html
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hindi Vartani Quiz</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
}

.container {
    max-width: 1200px;
    margin: 20px auto;
    padding: 20px;
}

.quiz-layout {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 20px;
}

.quiz {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.12);
}

.quiz-heading {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    line-height: 1.4;
    margin-bottom: 20px;
}

.quiz-heading small {
    display: block;
    font-size: 15px;
    font-weight: normal;
    margin-top: 5px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    margin-bottom: 20px;
}

.timer {
    background: #222;
    color: white;
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: bold;
}

.question {
    font-size: 24px;
    font-weight: bold;
    line-height: 1.5;
    margin: 25px 0;
}

.option {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    font-size: 18px;
    text-align: left;
    border: 2px solid #ddd;
    border-radius: 8px;
    background: white;
    cursor: pointer;
}

.option:hover {
    background: #f5f5f5;
}

.option.selected {
    background: #eeeeee;
    border-color: #222;
}

.buttons {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 25px;
}

.prev,
.next {
    padding: 12px 25px;
    font-size: 18px;
    border: 0;
    border-radius: 8px;
    background: #222;
    color: white;
    cursor: pointer;
}

.prev:disabled {
    background: #aaa;
    cursor: not-allowed;
}

.question-panel {
    background: white;
    padding: 18px;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.12);
    max-height: 650px;
    overflow-y: auto;
}

.panel-title {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    line-height: 1.4;
    margin-bottom: 15px;
}

.panel-title small {
    display: block;
    font-size: 13px;
    font-weight: normal;
    margin-top: 5px;
}

.question-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
}

.q-number {
    padding: 9px 4px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #f5f5f5;
    cursor: pointer;
    text-align: center;
    font-size: 14px;
}

.q-number.answered {
    background: #d9f7df;
    border-color: #35a853;
    color: #137333;
}

.q-number.unanswered {
    background: #ffd6d6;
    border-color: #e00000;
    color: #b00000;
}

.q-number.current {
    background: #222;
    color: white;
    border-color: #222;
}

.q-number.current.unanswered {
    background: #ffd6d6;
    color: #b00000;
    border-color: #e00000;
}

.q-number.current.answered {
    background: #d9f7df;
    color: #137333;
    border-color: #35a853;
}

.result {
    text-align: center;
}

.score {
    font-size: 50px;
    font-weight: bold;
    margin: 20px;
}

.restart {
    padding: 12px 25px;
    font-size: 18px;
    border: 0;
    border-radius: 8px;
    background: #222;
    color: white;
    cursor: pointer;
}

@media(max-width:700px) {

    .container {
        padding: 10px;
    }

    .quiz-layout {
        grid-template-columns: 1fr;
    }

    .quiz {
        order: 1;
        padding: 18px;
    }

    .question-panel {
        order: 2;
        max-height: none;
    }

    .question-grid {
        grid-template-columns: repeat(6, 1fr);
    }

    .quiz-heading {
        font-size: 20px;
    }

    .quiz-heading small {
        font-size: 13px;
    }

    .question {
        font-size: 20px;
    }

    .option {
        font-size: 16px;
    }

    .prev,
    .next {
        width: 50%;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="quiz-layout">

<div class="quiz" id="quiz">

<div class="quiz-heading">
वर्तनी शुद्धि
<small>
(पिछले सालों में RO/ARO की परीक्षा में पूछे गए महत्वपूर्ण प्रश्न)
</small>
</div>

<div class="top">
<strong id="number"></strong>

<span class="timer">
⏱️ <span id="timer">10</span>
</span>
</div>

<div class="question" id="question"></div>

<div id="options"></div>

<div class="buttons">
<button class="prev" id="prev">← Previous</button>
<button class="next" id="next">Next →</button>
</div>

</div>

<div class="question-panel">

<div class="panel-title">
वर्तनी शुद्धि
<small>
(पिछले सालों में RO/ARO की परीक्षा में पूछे गए महत्वपूर्ण प्रश्न)
</small>
</div>

<div class="question-grid" id="questionGrid"></div>

</div>

</div>

</div>

<script>

/*
====================================================
QUESTIONS
====================================================
*/

const questions = [
    {
        q: "निम्नलिखित में से शुद्ध वर्तनी वाला शब्द कौन-सा है?",
        o: [
            "लब्धप्रतिष्ठ",
            "लब्धप्रतिष्ठा",
            "लब्धप्रतिष्ठित",
            "लब्धप्रतिष्ट"
        ],
        a: 0
    },

    {
        q: "निम्नलिखित में से शुद्ध वर्तनी वाला शब्द कौन-सा है?",
        o: [
            "आवश्यक",
            "आवष्यक",
            "आवस्यक",
            "आवशयक"
        ],
        a: 0
    },

    {
        q: "निम्नलिखित में से शुद्ध वर्तनी वाला शब्द कौन-सा है?",
        o: [
            "स्वास्थ्य",
            "स्वास्थय",
            "स्वास्थ",
            "स्वास्थ्थ"
        ],
        a: 0
    },

    {
        q: "निम्नलिखित में से शुद्ध वर्तनी वाला शब्द कौन-सा है?",
        o: [
            "उज्ज्वल",
            "उज्वल",
            "उज्जवल",
            "उज्व्वल"
        ],
        a: 0
    },

    {
        q: "निम्नलिखित में से शुद्ध वर्तनी वाला शब्द कौन-सा है?",
        o: [
            "अत्यधिक",
            "अत्याधिक",
            "अत्यधीक",
            "अतयधिक"
        ],
        a: 0
    }

];

/*
====================================================
VARIABLES
====================================================
*/

let current = 0;

let userAnswers =
    new Array(questions.length).fill(null);

let visited =
    new Array(questions.length).fill(false);

let timeLeft = 10;

let timer;

/*
====================================================
ELEMENTS
====================================================
*/

const questionBox =
    document.getElementById("question");

const optionsBox =
    document.getElementById("options");

const numberBox =
    document.getElementById("number");

const nextButton =
    document.getElementById("next");

const prevButton =
    document.getElementById("prev");

const timerBox =
    document.getElementById("timer");

const questionGrid =
    document.getElementById("questionGrid");

/*
====================================================
CREATE QUESTION PANEL
====================================================
*/

function createQuestionPanel() {

    questionGrid.innerHTML = "";

    questions.forEach(function(item, index) {

        const button =
            document.createElement("button");

        button.className = "q-number";

        button.textContent = index + 1;

        button.onclick = function() {

            if (userAnswers[current] === null) {
                visited[current] = true;
            }

            current = index;

            loadQuestion();
        };

        questionGrid.appendChild(button);
    });
}

/*
====================================================
UPDATE PANEL
====================================================
*/

function updateQuestionPanel() {

    document
        .querySelectorAll(".q-number")
        .forEach(function(button, index) {

            button.classList.remove("current");
            button.classList.remove("answered");
            button.classList.remove("unanswered");

            if (userAnswers[index] !== null) {

                button.classList.add("answered");

            }
            else if (visited[index] === true) {

                button.classList.add("unanswered");
            }

            if (index === current) {

                button.classList.add("current");
            }

        });
}

/*
====================================================
TIMER
====================================================
*/

function startTimer() {

    clearInterval(timer);

    timeLeft = 10;

    timerBox.textContent = timeLeft;

    timer = setInterval(function() {

        timeLeft--;

        timerBox.textContent = timeLeft;

        if (timeLeft <= 0) {

            clearInterval(timer);

            if (userAnswers[current] === null) {

                visited[current] = true;
            }

            updateQuestionPanel();

            goNext();
        }

    }, 1000);
}

/*
====================================================
LOAD QUESTION
====================================================
*/

function loadQuestion() {

    clearInterval(timer);

    const item = questions[current];

    numberBox.textContent =
        "प्रश्न " +
        (current + 1) +
        " / " +
        questions.length;

    questionBox.textContent = item.q;

    optionsBox.innerHTML = "";

    item.o.forEach(function(option, index) {

        const button =
            document.createElement("button");

        button.className = "option";

        button.textContent =
            String.fromCharCode(65 + index) +
            ". " +
            option;

        if (userAnswers[current] === index) {

            button.classList.add("selected");
        }

        button.onclick = function() {

            selectAnswer(index);
        };

        optionsBox.appendChild(button);
    });

    prevButton.disabled = current === 0;

    if (current === questions.length - 1) {

        nextButton.textContent =
            "Submit Quiz ✓";

    }
    else {

        nextButton.textContent =
            "Next →";
    }

    updateQuestionPanel();

    startTimer();
}

/*
====================================================
SELECT ANSWER
====================================================
*/

function selectAnswer(index) {

    userAnswers[current] = index;

    visited[current] = false;

    document
        .querySelectorAll(".option")
        .forEach(function(button, i) {

            button.classList.remove("selected");

            if (i === index) {

                button.classList.add("selected");
            }

        });

    updateQuestionPanel();
}

/*
====================================================
NEXT
====================================================
*/

function goNext() {

    clearInterval(timer);

    if (userAnswers[current] === null) {

        visited[current] = true;
    }

    updateQuestionPanel();

    if (current < questions.length - 1) {

        current++;

        loadQuestion();

    }
    else {

        showResult();
    }
}

/*
====================================================
PREVIOUS
====================================================
*/

function goPrevious() {

    clearInterval(timer);

    if (userAnswers[current] === null) {

        visited[current] = true;
    }

    if (current > 0) {

        current--;

        loadQuestion();
    }
}

/*
====================================================
BUTTONS
====================================================
*/

nextButton.onclick = function() {

    goNext();
};

prevButton.onclick = function() {

    goPrevious();
};

/*
====================================================
RESULT
====================================================
*/

function showResult() {

    clearInterval(timer);

    let score = 0;

    userAnswers.forEach(function(answer, index) {

        if (
            answer !== null &&
            answer === questions[index].a
        ) {

            score++;
        }

    });

    const total = questions.length;

    const answered =
        userAnswers.filter(function(answer) {

            return answer !== null;

        }).length;

    const wrong =
        answered - score;

    const unanswered =
        total - answered;

    const accuracy =
        total > 0
        ? Math.round((score / total) * 100)
        : 0;

    document.getElementById("quiz").innerHTML =

        '<div class="result">' +

        '<h2>🎉 Quiz पूरा हो गया!</h2>' +

        '<div class="score">' +
        score +
        ' / ' +
        total +
        '</div>' +

        '<p>✅ सही: ' +
        score +
        '</p>' +

        '<p>❌ गलत: ' +
        wrong +
        '</p>' +

        '<p>⭕ बिना उत्तर: ' +
        unanswered +
        '</p>' +

        '<p>🎯 Accuracy: ' +
        accuracy +
        '%</p>' +

        '<button class="restart" ' +
        'onclick="location.reload()">' +

        'फिर से Quiz दें' +

        '</button>' +

        '</div>';
}

/*
====================================================
START
====================================================
*/

createQuestionPanel();

loadQuestion();

</script>

</body>
</html>
