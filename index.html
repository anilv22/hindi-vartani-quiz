<!DOCTYPE html>

<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Hindi Vartani Quiz</title>


<style>

* {
    box-sizing: border-box;
}

body {

    font-family: Arial, sans-serif;

    background: #f2f2f2;

    margin: 0;

}


.container {

    max-width: 1200px;

    margin: 20px auto;

    padding: 20px;

}


/* ==============================
   QUIZ LAYOUT
============================== */

.quiz-layout {

    display: grid;

    grid-template-columns: 1fr 280px;

    gap: 20px;

}


/* ==============================
   QUIZ
============================== */

.quiz {

    background: white;

    padding: 25px;

    margin-top: 20px;

    border-radius: 12px;

    box-shadow:
        0 3px 15px rgba(0,0,0,0.12);

}


/* ==============================
   MAIN HEADING
============================== */

.quiz-heading {

    font-size: 24px;

    font-weight: bold;

    text-align: center;

    margin-top: 5px;

    margin-bottom: 25px;

    line-height: 1.4;

}


.quiz-heading small {

    display: block;

    font-size: 15px;

    font-weight: normal;

    margin-top: 5px;

    line-height: 1.5;

}


/* ==============================
   TOP
============================== */

.top {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 20px;

    font-size: 18px;

}


/* ==============================
   TIMER
============================== */

.timer {

    background: #222;

    color: white;

    padding: 8px 14px;

    border-radius: 8px;

    font-weight: bold;

}


/* ==============================
   QUESTION
============================== */

.question {

    font-size: 24px;

    font-weight: bold;

    margin: 25px 0;

    line-height: 1.5;

}


/* ==============================
   OPTIONS
============================== */

.option {

    display: block;

    width: 100%;

    padding: 15px;

    margin: 10px 0;

    font-size: 18px;

    text-align: left;

    border: 2px solid #ddd;

    border-radius: 8px;

    background: white;

    cursor: pointer;

}

.option:hover {

    background: #f5f5f5;

}

.option.selected {

    background: #eeeeee;

    border-color: #222;

}


/* ==============================
   BUTTONS
============================== */

.buttons {

    display: flex;

    justify-content: space-between;

    margin-top: 25px;

    gap: 10px;

}

.prev,
.next {

    padding: 12px 25px;

    font-size: 18px;

    border: 0;

    border-radius: 8px;

    background: #222;

    color: white;

    cursor: pointer;

}


.prev:disabled {

    background: #aaa;

    cursor: not-allowed;

}


/* ==============================
   QUESTION PANEL
============================== */

.question-panel {

    background: white;

    padding: 18px;

    margin-top: 20px;

    border-radius: 12px;

    box-shadow:
        0 3px 15px rgba(0,0,0,0.12);

    max-height: 600px;

    overflow-y: auto;

}


.panel-title {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 15px;

    text-align: center;

    line-height: 1.4;

}


.panel-title small {

    display: block;

    font-size: 13px;

    font-weight: normal;

    margin-top: 5px;

    line-height: 1.4;

}


/* ==============================
   QUESTION NUMBERS
============================== */

.question-grid {

    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 8px;

}


.q-number {

    padding: 9px 4px;

    border: 1px solid #ccc;

    border-radius: 6px;

    background: #f5f5f5;

    cursor: pointer;

    text-align: center;

    font-size: 14px;

}


/* ==============================
   ANSWERED = GREEN
============================== */

.q-number.answered {

    background: #d9f7df;

    border-color: #35a853;

    color: #137333;

}


/* ==============================
   UNANSWERED = RED
============================== */

.q-number.unanswered {

    background: #ffd6d6;

    border-color: #e00000;

    color: #b00000;

}


/* ==============================
   CURRENT
============================== */

.q-number.current {

    background: #222;

    color: white;

    border-color: #222;

}


/* Current unanswered */

.q-number.current.unanswered {

    background: #ffd6d6;

    color: #b00000;

    border-color: #e00000;

}


/* Current answered */

.q-number.current.answered {

    background: #d9f7df;

    color: #137333;

    border-color: #35a853;

}


/* ==============================
   RESULT
============================== */

.result {

    text-align: center;

}


.score {

    font-size: 50px;

    font-weight: bold;

    margin: 20px;

}


.restart {

    padding: 12px 25px;

    font-size: 18px;

    border: 0;

    border-radius: 8px;

    background: #222;

    color: white;

    cursor: pointer;

}


/* ==============================
   MOBILE
============================== */

@media(max-width: 700px) {

    .quiz-layout {

        grid-template-columns: 1fr;

    }

    .quiz {

        order: 1;

    }

    .question-panel {

        order: 2;

        max-height: none;

    }

    .question-grid {

        grid-template-columns:
            repeat(6, 1fr);

    }

    .question {

        font-size: 20px;

    }

    .option {

        font-size: 16px;

    }

    .quiz-heading {

        font-size: 20px;

    }

    .quiz-heading small {

        font-size: 13px;

    }

    .prev,
    .next {

        width: 50%;

    }

}

</style>

</head>

/* ==============================
   VARIABLES
============================== */

let current = 0;


let userAnswers =
    new Array(questions.length)
    .fill(null);


let visited =
    new Array(questions.length)
    .fill(false);


let timeLeft = 10;

let timer;


/* ==============================
   ELEMENTS
============================== */

const questionBox =
    document.getElementById("question");

const optionsBox =
    document.getElementById("options");

const numberBox =
    document.getElementById("number");

const nextButton =
    document.getElementById("next");

const prevButton =
    document.getElementById("prev");

const timerBox =
    document.getElementById("timer");

const questionGrid =
    document.getElementById("questionGrid");


/* ==============================
   CREATE QUESTION PANEL
============================== */

function createQuestionPanel() {

    questionGrid.innerHTML = "";


    questions.forEach(
        function(item, index) {


            const button =
                document.createElement("button");


            button.className =
                "q-number";


            button.textContent =
                index + 1;


            button.onclick =
                function() {


                    /*
                       अगर current question
                       unanswered है तो RED
                    */

                    if (
                        userAnswers[current] === null
                    ) {

                        visited[current] = true;

                    }


                    current = index;


                    loadQuestion();

                };


            questionGrid.appendChild(
                button
            );

        }
    );

}


/* ==============================
   UPDATE PANEL
============================== */

function updateQuestionPanel() {

    document
        .querySelectorAll(".q-number")
        .forEach(
            function(button, index) {


                button.classList.remove(
                    "current"
                );


                button.classList.remove(
                    "answered"
                );


                button.classList.remove(
                    "unanswered"
                );


                /*
                   Answer दिया है
                   = GREEN
                */

                if (
                    userAnswers[index] !== null
                ) {

                    button.classList.add(
                        "answered"
                    );

                }


                /*
                   Answer नहीं दिया
                   = RED
                */

                else if (
                    visited[index] === true
                ) {

                    button.classList.add(
                        "unanswered"
                    );

                }


                /*
                   Current question
                */

                if (
                    index === current
                ) {

                    button.classList.add(
                        "current"
                    );

                }

            }
        );

}


/* ==============================
   TIMER
============================== */

function startTimer() {

    clearInterval(timer);


    timeLeft = 10;


    timerBox.textContent =
        timeLeft;


    timer =
        setInterval(
            function() {


                timeLeft--;


                timerBox.textContent =
                    timeLeft;


                if (
                    timeLeft <= 0
                ) {


                    clearInterval(timer);


                    /*
                       No answer
                       = RED
                    */

                    if (
                        userAnswers[current]
                        === null
                    ) {

                        visited[current] =
                            true;

                    }


                    updateQuestionPanel();


                    goNext();

                }


            },
            1000
        );

}


/* ==============================
   LOAD QUESTION
============================== */

function loadQuestion() {

    clearInterval(timer);


    const item =
        questions[current];


    numberBox.textContent =

        "प्रश्न " +

        (current + 1) +

        " / " +

        questions.length;


    questionBox.textContent =
        item.q;


    optionsBox.innerHTML = "";


    item.o.forEach(
        function(option, index) {


            const button =
                document.createElement("button");


            button.className =
                "option";


            button.textContent =

                String.fromCharCode(
                    65 + index
                )

                + ". "

                + option;


            /*
               Restore selected answer
            */

            if (
                userAnswers[current]
                === index
            ) {

                button.classList.add(
                    "selected"
                );

            }


            button.onclick =
                function() {

                    selectAnswer(index);

                };


            optionsBox.appendChild(
                button
            );

        }
    );


    /*
       Previous button
       Question 1 पर disabled
       रहेगा लेकिन दिखाई देगा।
    */

    prevButton.disabled =
        current === 0;


    /*
       Last question
    */

    if (
        current ===
        questions.length - 1
    ) {

        nextButton.textContent =
            "Submit Quiz ✓";

    }

    else {

        nextButton.textContent =
            "Next →";

    }


    updateQuestionPanel();


    startTimer();

}


/* ==============================
   SELECT ANSWER
============================== */

function selectAnswer(index) {


    userAnswers[current] =
        index;


    /*
       Answer मिल गया
       इसलिए RED हटेगा
    */

    visited[current] =
        false;


    document
        .querySelectorAll(".option")
        .forEach(
            function(button, i) {


                button.classList.remove(
                    "selected"
                );


                if (
                    i === index
                ) {

                    button.classList.add(
                        "selected"
                    );

                }

            }
        );


    updateQuestionPanel();

}


/* ==============================
   NEXT
============================== */

function goNext() {

    clearInterval(timer);


    /*
       बिना answer Next
       = RED
    */

    if (
        userAnswers[current] === null
    ) {

        visited[current] =
            true;

    }


    updateQuestionPanel();


    if (
        current <
        questions.length - 1
    ) {

        current++;


        loadQuestion();

    }

    else {

        showResult();

    }

}


/* ==============================
   PREVIOUS
============================== */

function goPrevious() {

    clearInterval(timer);


    /*
       Current question unanswered
       है तो RED करें।
    */

    if (
        userAnswers[current] === null
    ) {

        visited[current] = true;

    }


    if (
        current > 0
    ) {

        current--;

        loadQuestion();

    }

}


/* ==============================
   NEXT BUTTON
============================== */

nextButton.onclick =
    function() {

        goNext();

    };


/* ==============================
   PREVIOUS BUTTON
============================== */

prevButton.onclick =
    function() {

        goPrevious();

    };


/* ==============================
   RESULT
============================== */

function showResult() {

    clearInterval(timer);


    let score = 0;


    userAnswers.forEach(
        function(answer, index) {


            if (

                answer !== null &&

                answer ===
                questions[index].a

            ) {

                score++;

            }

        }
    );


    const total =
        questions.length;


    const answered =
        userAnswers.filter(
            function(answer) {

                return answer !== null;

            }
        ).length;


    const wrong =
        answered - score;


    const unanswered =
        total - answered;


    const accuracy =

        total > 0

        ? Math.round(
            (score / total) * 100
          )

        : 0;


    document.getElementById("quiz")
        .innerHTML =


        '<div class="result">' +


        '<h2>🎉 Quiz पूरा हो गया!</h2>' +


        '<div class="score">' +

        score +

        ' / ' +

        total +

        '</div>' +


        '<p>✅ सही: ' +

        score +

        '</p>' +


        '<p>❌ गलत: ' +

        wrong +

        '</p>' +


        '<p>⭕ बिना उत्तर: ' +

        unanswered +

        '</p>' +


        '<p>🎯 Accuracy: ' +

        accuracy +

        '%</p>' +


        '<button class="restart" ' +

        'onclick="location.reload()">' +


        'फिर से Quiz दें' +


        '</button>' +


        '</div>';

}


/* ==============================
   START
============================== */

createQuestionPanel();

loadQuestion();


</script>
